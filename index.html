<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Mở ra thấy yêu</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;800;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>
  <main class="experience">
    <canvas id="background"></canvas>
    <canvas id="scene"></canvas>
    <div class="vignette"></div>

    <button id="sound-button" class="icon-button hidden" type="button" aria-label="Tắt âm thanh">
      <svg class="sound-on" viewBox="0 0 24 24"><path d="M5 9v6h4l5 4V5L9 9H5Zm12.2-.7a5.2 5.2 0 0 1 0 7.4M19.7 5.8a9 9 0 0 1 0 12.4"/></svg>
      <svg class="sound-off" viewBox="0 0 24 24"><path d="M5 9v6h4l5 4V5L9 9H5Zm12 1 5 5m0-5-5 5"/></svg>
    </button>

    <button id="replay-button" class="replay-button hidden" type="button">Xem lại</button>
    <p id="audio-hint" class="audio-hint hidden">Chạm màn hình để bật nhạc ♪</p>
  </main>

  <section id="orientation-overlay" class="overlay orientation-overlay hidden">
    <div class="rotate-card">
      <div class="phone"><span></span></div>
      <h2>Xoay ngang điện thoại nhé</h2>
      <p>Để lời nhắn hiện ra đẹp nhất</p>
    </div>
  </section>

  <audio id="soundtrack" preload="auto" src="Data/romantic-audio.m4a"></audio>
  <script src="script.js?v=2.0"></script>
</body>
</html>
