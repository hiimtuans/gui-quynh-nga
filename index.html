<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050207">
  <meta name="description" content="Một món quà nhỏ Anh Tuấn dành riêng cho Quỳnh Nga.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gửi Quỳnh Nga ♥">
  <meta property="og:description" content="Một món quà nhỏ từ Anh Tuấn.">
  <meta property="og:url" content="https://hiimtuans.github.io/gui-quynh-nga/">
  <meta property="og:image" content="https://hiimtuans.github.io/gui-quynh-nga/Data/preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>Gửi Quỳnh Nga ♥</title>
  <link rel="canonical" href="https://hiimtuans.github.io/gui-quynh-nga/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <main class="experience" aria-label="Món quà Anh Tuấn dành cho Quỳnh Nga">
    <canvas id="background" aria-hidden="true"></canvas>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <button id="sound-button" class="icon-button hidden" type="button" aria-label="Tắt âm thanh" title="Tắt âm thanh">
      <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5Zm12.2-.7a5.2 5.2 0 0 1 0 7.4M19.7 5.8a9 9 0 0 1 0 12.4"/></svg>
      <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5Zm12 1 5 5m0-5-5 5"/></svg>
    </button>
    <button id="replay-button" class="replay-button hidden" type="button">Xem lại</button>
    <p id="audio-hint" class="audio-hint hidden">Chạm màn hình để bật nhạc ♪</p>
    <p id="live-message" class="sr-only" aria-live="polite"></p>
  </main>

  <section id="orientation-overlay" class="overlay orientation-overlay hidden" aria-live="polite">
    <div class="rotate-card">
      <div class="phone" aria-hidden="true"><span></span></div>
      <h2>Xoay ngang điện thoại nhé</h2>
      <p>Để lời nhắn hiện ra đẹp nhất</p>
    </div>
  </section>

  <audio id="soundtrack" preload="auto">
    <source src="Data/love-theme.m4a" type="audio/mp4">
    <source src="Data/love-theme.mp3" type="audio/mpeg">
  </audio>
  <script src="script.js?v=5"></script>
</body>
</html>
